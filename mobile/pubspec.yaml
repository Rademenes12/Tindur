name: tindur_mobile
description: "Tindur booking app for iOS/Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # API & State
  http: ^1.1.0
  provider: ^6.0.0
  
  # UI
  flutter_svg: ^2.0.0
  smooth_page_indicator: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.0
  
  # Design tokens from web
  flutter_gen: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
